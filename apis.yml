aid: savvymoney
name: SavvyMoney
description: 'SavvyMoney is a Dublin, California based financial technology company that
  supplies credit score, credit monitoring, financial wellness, pre-qualified offer and
  digital account-opening software to banks and credit unions. Its platform is delivered
  embedded inside a financial institution''s existing online and mobile banking rather than
  as a standalone destination, and SavvyMoney states it is live across 70+ pre-built
  integrations spanning 40+ digital banking platforms including Alkami, Fiserv, Q2, Lumin
  and Candescent. The technical surface partners integrate against is a partner-scoped REST
  API on creditscore.savvymoney.com: a JWT-based Single Sign-On API (authenticate, sign-on,
  optional browser fingerprint, prolong, log off, and a RelayPost form endpoint) that hands
  a partner''s authenticated member into SavvyMoney without a second credential, plus an
  External Credit API that returns User Status and User Credit Score data so the partner can
  render score, score change and monitoring alerts in its own UI. Embeddable iFrame widgets
  (score widget, offer widget, desktop and mobile dashboards) are published alongside the API,
  and a documented beta environment runs at creditscoretest.savvymoney.com. Credentials, the
  full API document and the partner hub are gated behind a partner agreement; no OpenAPI,
  AsyncAPI, SDK, MCP server or agent card is published publicly.'
