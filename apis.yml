apis:
- name: SavvyMoney SSO REST API
  description: 'JWT-based Single Sign-On REST API that lets a partner''s online or mobile
    banking platform transfer an authenticated member into SavvyMoney without a second set of
    credentials. Publicly documented operations are an authentication call that returns a
    short-lived authorization code, an optional browser fingerprint call, a sign-on call that
    exchanges the code for an access token and redirect URL, a prolong call that extends the
    token, a log off call that revokes it immediately, and a RelayPost form endpoint used for
    iFrame embedding. Member attributes are passed as an attributes[] array and may be AES/CBC
    encrypted. Access tokens expire in 10 minutes. TLS 1.2 only.'
  humanURL: https://hub.savvymoney.com/sphub/cms/delivery/media/MCTB4AZJKJRJBWFAXB4W2WLUCAPQ
  baseURL: https://creditscore.savvymoney.com
