- name: SavvyMoney External Credit API
  description: 'Partner-facing REST API that returns select credit data for an SSO-identified
    member so the partner can render it inside its own experience. SavvyMoney''s published
    Mobile Integration Guide names two operations: User Status, which returns whether a member
    is enrolled in SavvyMoney so the partner can show its own marketing message to non-enrolled
    users, and User Credit Score, which returns the member''s credit score, score rating,
    monitoring alerts and the date of the latest score pull. Called with the access token issued
    by the SSO API in an HTTP Authorization header. The full endpoint reference lives in the
    partner-gated "SavvyMoney API Document".'
  humanURL: https://hub.savvymoney.com/sphub/cms/delivery/media/MCS7KWMTKCWNE7VNGJI5TFUISKCY
