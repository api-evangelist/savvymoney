scheme_note: >-
  SavvyMoney publishes no product changelog, release-notes feed or dated "what's new" page for its
  API. What it does publish, on the public partner-hub CDN, is a dated revision history on the front
  of each integration guide, and those rows describe real API changes (endpoints added, endpoint
  domains changed, security requirements tightened). This artifact records that revision history
  verbatim and is explicitly NOT a release feed — there is no machine-readable changelog to
  subscribe to, and the most recent recorded change is from 2022.
