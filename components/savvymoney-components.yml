alternative_data_path:
  note: >-
    Partners that do not want SavvyMoney's UI call the External Credit API (User Status, User Credit
    Score) and render score, score change and alerts themselves. SavvyMoney describes this as the
    path for partners that "want to drive the look and feel of how that limited data is presented".
