distribution: hosted-iframe
distribution_note: >-
  SavvyMoney's client-side surface is a set of hosted, SSO-gated application URLs embedded in an
  iFrame — not an npm element library, not web components, and not a JS loader SDK. The partner
  posts an authorization code to a relay endpoint and points an iFrame at the returned application
  URL. There is no loader library to install and no versioned component package, so nothing appears
  in packages/.
