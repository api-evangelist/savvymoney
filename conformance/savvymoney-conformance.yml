standards:
- id: jwt
  name: JSON Web Token (RFC 7519)
  conforms: true
  evidence: >-
    "SavvyMoney APIs use the JSON Web Tokens (JWTs) technology for Single Sign On (SSO)
    authentication and authorization." Auth Key is issued "in JWT format" and the authorization code
    is returned in JWT format.
  source: https://hub.savvymoney.com/sphub/cms/delivery/media/MCTB4AZJKJRJBWFAXB4W2WLUCAPQ
- id: saml2
  name: SAML 2.0
  conforms: true
  evidence: >-
    SAML 2.0 is documented as a supported alternative to the REST flow for establishing SSO from a
    partner's online or mobile banking platform, with a worked iFrame example targeting a
    /SAML2/SSO endpoint on the partner side.
  source: https://hub.savvymoney.com/sphub/cms/delivery/media/MCS7KWMTKCWNE7VNGJI5TFUISKCY
- id: oidc
  name: OpenID Connect Discovery 1.0
  conforms: true
  scope: hub.savvymoney.com (Partner Hub sign-in) only
  evidence: >-
    A conformant discovery document is served at https://hub.savvymoney.com/.well-known/openid-configuration
    with issuer, authorization_endpoint, token_endpoint, userinfo_endpoint, jwks_uri,
    registration_endpoint, introspection_endpoint and revocation_endpoint. Emitted by the Salesforce
    Experience Cloud platform hosting the hub; it does NOT cover the credit/SSO REST API.
  source: https://hub.savvymoney.com/.well-known/openid-configuration
- id: oauth2
  name: OAuth 2.0
  conforms: partial
  scope: hub.savvymoney.com only
  evidence: >-
    The hub advertises OAuth 2.0 authorization-code and token endpoints, DPoP signing algorithms and
    private_key_jwt client authentication. The credit API does NOT use OAuth 2.0 — it uses a
    proprietary authId/authKey exchange that borrows OAuth vocabulary ("access token",
    "authorization code") without implementing the RFC 6749 grant types.
  source: https://hub.savvymoney.com/.well-known/openid-configuration
- id: rfc9457
  name: RFC 9457 Problem Details for HTTP APIs
  conforms: false
  evidence: >-
    Errors are returned as a vendor envelope {"hasErrors": true, "errorMessage": "..."} with
    content-type application/json, and — critically — with HTTP 200 rather than a 4xx status. No
    application/problem+json is served.
  source: errors/savvymoney-problem-types.yml
