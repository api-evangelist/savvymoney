domain_standards:
  market: consumer credit data / financial institution software
  finding: >-
    No domain-standard signature is present in the contract. SavvyMoney's partner API is a
    proprietary JWT/SSO shape; it carries no FDX resource model, no OFX/QFX message type, no ISO
    20022 message, no SCIM schema URN, no OData $metadata surface and no FAPI profile. Its consumer
    credit lineage is TransUnion (named as a subprocessor on the trust center) rather than a
    published standard. REWARD-ONLY dimension — recorded as absent, not as a failure, and nothing is
    invented to fill the slot.
  probed_for:
  - FDX (Financial Data Exchange)
  - FAPI (Financial-grade API)
  - OFX
  - ISO 20022
  - SCIM
  - OData
  result: none declared
