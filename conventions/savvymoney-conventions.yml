note: >-
  Cross-cutting runtime semantics for the SavvyMoney partner REST API, read from SavvyMoney's own
  public SSO Integration guide and Mobile Integration guide plus live probes. No OpenAPI exists, so
  nothing here is derived from a spec.
auth_style:
  model: partner-scoped JWT
  header: Authorization
  token_lifetime_seconds: 600
  see: authentication/savvymoney-authentication.yml
idempotency:
  supported: unknown
  status: undocumented
  note: >-
    No idempotency key, no Idempotency-Key header, and no replay semantics are documented anywhere
    in the public guides, and there is no spec to derive them from. The write surface is limited to
    session operations (sign-on, prolong, log off), where a repeated call is materially different
    from a no-op — prolong extends a token and log off destroys it. Recorded as undocumented
    rather than absent, and NO Idempotency pointer is emitted.
pagination:
  supported: unknown
  status: undocumented
  note: The credit endpoints return a single member's status/score; no collection endpoint is publicly documented.
field_expansion:
  supported: false
  note: Not documented.
metadata:
  supported: true
  mechanism: >-
    The SSO attributes array accepts supplemental1, supplemental2 and supplemental3 as
    partner-defined passthrough values alongside the fixed member attributes.
request_id_tracing:
  supported: partial
  mechanism: >-
    Responses carry a W3C-format Server-Timing traceparent header, e.g.
    'server-timing: traceparent;desc="00-<trace-id>-<span-id>-03"', exposed to the browser via
    access-control-expose-headers: Server-Timing. No documented correlation-ID request header.
  observed: '2026-08-26'
