reversibility:
  grade: documented
  applies_to: session/authorization surface only
  data_surface_note: >-
    The credit data surface (User Status, User Credit Score) is READ-ONLY — it returns a member's
    score, rating, alerts and last pull date and creates nothing. Reversibility, dry-run and
    idempotency are therefore `na` for that surface. The only write-like actions SavvyMoney
    publicly documents are session grants, and those DO have a reversal path.
  operations:
  - action: Grant an access token (SSO Sign On)
    reversal: 'SSO Log Off API — POST /sso/api/rest/logoff, returns {"hasErrors": false, "loggedOff": true}'
    window: >-
      Stated by the provider: "Make a logoff request to SavvyMoney SSO server in order to log off
      the access token immediately. Otherwise, the access token will automatically expire in 10
      minutes." The reversal is immediate and the grant self-reverses at 10 minutes.
    window_source: https://hub.savvymoney.com/sphub/cms/delivery/media/MCTB4AZJKJRJBWFAXB4W2WLUCAPQ
    grade: verified
  - action: Extend an access token (SSO Prolong)
    reversal: SSO Log Off API
    window: Same 10-minute token lifetime restarts; no separate reversal window is stated.
    grade: documented
  - action: SSO enrollment of a member into SavvyMoney
    reversal: null
    window: null
    note: >-
      No unenroll, delete-member or data-deletion operation is documented in the public API guides.
      Member data removal is described only in the privacy policy as a human request process, not
      as an API operation. NOT graded — an undocumented reversal is recorded as absent, not assumed.
    grade: absent
  overall_note: >-
    Graded `documented` overall rather than `verified` because the one operation with a stated
    window is a session revocation, while the enrollment side-effect an SSO call actually creates
    has no published reversal at all.
dry_run_mode:
  supported: partial
  note: >-
    There is no dry-run flag, but SavvyMoney publishes a full separate beta environment at
    creditscoretest.savvymoney.com with its own static IPs and its own application URLs, which is
    the rehearsal surface a partner uses instead.
  see: sandbox/savvymoney-sandbox.yml
